<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf2e9"><title>Nuestra boda | Invitación</title><style>
:root{--wine:#823d50;--cream:#faf2e9;--ink:#573e43}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 10% 10%,#fff 0,transparent 42%),var(--cream);font-family:Georgia,serif;color:var(--ink);display:grid;place-items:center;padding:20px}.wrap{width:min(100%,470px);text-align:center}.eyebrow{font:600 11px system-ui;letter-spacing:.25em;color:var(--wine)}.line{height:1px;background:#d9bdc0;margin:20px auto;width:80px}.card{background:#fffdf9;border:1px solid #ebd9d5;border-radius:22px;padding:clamp(24px,7vw,45px) 24px;box-shadow:0 15px 50px #713e4b13;min-height:420px;display:flex;flex-direction:column;justify-content:center;animation:rise .45s ease}.heart{font-size:36px;color:var(--wine)}h1{font-weight:400;color:var(--wine);font-size:clamp(29px,8vw,43px);line-height:1.2;margin:18px 0}p{line-height:1.65;color:#8c777a}.buttons{display:grid;gap:12px;margin-top:22px}button,a.btn{display:block;width:100%;border:1px solid var(--wine);border-radius:100px;padding:15px 16px;font:600 14px system-ui;cursor:pointer;text-decoration:none;transition:transform .2s,background .2s;background:var(--wine);color:white}button:hover,a.btn:hover{transform:translateY(-2px)}button.secondary{background:transparent;color:var(--wine)}.progress{display:flex;justify-content:center;gap:7px;margin:0 0 18px}.dot{width:33px;height:4px;border-radius:8px;background:#e8d4d4}.dot.active{background:var(--wine)}.small{font:12px system-ui;color:#a18a8d;margin-top:20px}.feedback{color:var(--wine);font-size:14px;margin-top:14px}.hidden{display:none}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style></head><body><main class="wrap"><div class="eyebrow">THE WEDDING EXPERIENCE</div><div class="line"></div><div id="progress" class="progress"></div><section id="card" class="card" aria-live="polite"></section><div class="small">Hecho con amor ♡</div></main><script>
// Cuando tengas tu enlace, reemplaza el texto entre comillas.
const WEDDINGS_URL = '';
const questions=[
{title:'¿Quieres venir a mi boda? 💍',sub:'Tenemos una pregunta muy importante para ti...',options:['¡Sí, obviamente! ❤️','No 😒']},
{title:'¿Qué tanto te emociona mi boda?',sub:'Responde con toda sinceridad...',options:['¡Más que mi propio cumpleaños! 😍','Muchísimo 🥹','Voy por la comida 😂']},
{title:'¿Qué vas a traer como regalo de boda?',sub:'Piensa muy bien tu respuesta...',options:['Un regalito increíble 🎁','Un sobre con amor 💌','Mi hermosa presencia 😌']}
];
let step=0;let no=false;const card=document.getElementById('card');const progress=document.getElementById('progress');
function render(){progress.innerHTML=Array.from({length:4},(_,i)=>`<span class="dot ${i<=step?'active':''}"></span>`).join('');card.style.animation='none';void card.offsetWidth;card.style.animation='rise .45s ease';if(step===3){card.innerHTML=`<div class="heart">♡</div><div class="eyebrow">RESULTADO DEL CUESTIONARIO</div><h1>¡APROBASTE! ❤️</h1><p>¡Felicidades! Tienes una invitación a nuestra boda.</p><div class="buttons"><button id="open">💌 Ver mi invitación</button><button class="secondary" id="restart">Volver a jugar</button></div><p id="notice" class="feedback hidden">¡Pronto estará disponible nuestra invitación! 💕</p>`;document.getElementById('open').onclick=()=>{if(WEDDINGS_URL){window.location.href=WEDDINGS_URL}else{document.getElementById('notice').classList.remove('hidden')}};document.getElementById('restart').onclick=()=>{step=0;no=false;render()};return}const q=questions[step];card.innerHTML=`<div class="heart">♡</div><h1>${q.title}</h1><p>${q.sub}</p><div class="buttons" id="choices"></div><p class="feedback" id="feedback"></p>`;q.options.forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.className=i?'secondary':'';b.onclick=()=>{if(step===0&&i===1){document.getElementById('feedback').textContent='¿Cómo que no? 😭 ¡Piénsalo otra vez!';return}step++;render()};document.getElementById('choices').appendChild(b)})}render();
</script></body></html>
