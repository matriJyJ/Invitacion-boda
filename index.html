<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf2e9"><title>Jacqueline & José Luis | Nuestra boda</title><style>
:root{--wine:#823d50;--cream:#faf2e9;--ink:#573e43}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 10% 10%,#fff 0,transparent 42%),var(--cream);font-family:Georgia,serif;color:var(--ink);display:grid;place-items:center;padding:20px}.wrap{width:min(100%,490px);text-align:center}.eyebrow{font:600 10px system-ui;letter-spacing:.24em;color:var(--wine)}.names{font-size:clamp(24px,6vw,33px);color:var(--wine);margin:12px 0 4px;font-style:italic}.line{height:1px;background:#d9bdc0;margin:17px auto;width:80px}.card{background:#fffdf9;border:1px solid #ebd9d5;border-radius:22px;padding:clamp(23px,6vw,42px) 22px;box-shadow:0 15px 50px #713e4b13;min-height:425px;display:flex;flex-direction:column;justify-content:center;animation:rise .4s ease}.heart{font-size:35px;color:var(--wine)}h1{font-weight:400;color:var(--wine);font-size:clamp(27px,7vw,39px);line-height:1.22;margin:16px 0}p{line-height:1.6;color:#8c777a;margin:7px 0}.buttons{display:grid;gap:10px;margin-top:22px}button,a.btn{display:block;width:100%;border:1px solid var(--wine);border-radius:100px;padding:14px 13px;font:600 14px system-ui;cursor:pointer;text-decoration:none;transition:transform .2s,background .2s;background:var(--wine);color:white;touch-action:manipulation}button:hover,a.btn:hover{transform:translateY(-2px)}button.secondary{background:transparent;color:var(--wine)}.progress{display:flex;justify-content:center;gap:6px;margin:0 0 18px}.dot{flex:1;max-width:37px;height:4px;border-radius:8px;background:#e8d4d4}.dot.active{background:var(--wine)}.small{font:12px system-ui;color:#a18a8d;margin-top:19px}.feedback{color:var(--wine);font-size:13px;margin-top:14px;min-height:20px}.hidden{display:none}.no-arena{position:relative;height:102px;margin-top:12px;border:1px dashed #ecd7d9;border-radius:15px;overflow:hidden}.no-btn{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:135px;transition:left .18s,top .18s,transform .18s}.no-btn:hover{transform:translateX(-50%)}.celebrate{font-size:42px;animation:pop .6s ease}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes pop{50%{transform:scale(1.2)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="wrap"><div class="eyebrow">ESTÁS INVITADO A NUESTRA BODA</div><div class="names">Jacqueline <span aria-hidden="true">&</span> José Luis</div><div class="line"></div><div id="progress" class="progress" aria-label="Progreso del cuestionario"></div><section id="card" class="card" aria-live="polite"></section><div class="small">Una historia de amor que queremos celebrar contigo ♡</div></main><script>
// Más adelante pega aquí el enlace público de Weddings.cl, entre las comillas.
const WEDDINGS_URL = '';
const questions=[
{title:'¿Quieres venir a nuestra boda? 💍',sub:'Jacqueline y José Luis tenemos una pregunta MUY importante para ti…',options:['¡Sí, obvio! No me la pierdo ❤️']},
{title:'¿Qué tanto te emociona nuestra boda?',sub:'Prometemos no juzgar… demasiado 👀',options:['¡Ya tengo el outfit listo! 😍','¡Estoy contando los días! 🥹','¿Dijeron comida gratis? 😂','Depende de si hay barra libre 🍹']},
{title:'¿Qué harás cuando suene tu canción?',sub:'Necesitamos saber con quién contamos en la pista.',options:['¡Bailar hasta que me duelan los pies! 💃','¡Pedir que la repitan! 🎶','Mis pasos son secretos de Estado 🕺','Aplaudir desde mi silla 😂']},
{title:'¿Qué vas a llevar de regalo?',sub:'No hay respuestas incorrectas… o eso creemos 🤭',options:['Un regalito con mucho amor 🎁','Un sobre lleno de buenos deseos 💌','Mi presencia, que vale oro 😌','¡Sorpresa! No arruinen la magia ✨']},
{title:'¿Prometes celebrar con nosotros?',sub:'Última pregunta. ¡La más importante!',options:['¡Sí! Hasta el último baile 🥂','¡Sí! Y lloraré de emoción 🥹','¡Sí! Pero guárdenme torta 🍰','¡Sí! Que comience la fiesta 🎉']}
];
let step=0;const card=document.getElementById('card'),progress=document.getElementById('progress');
function next(){step++;render()}
function render(){progress.innerHTML=Array.from({length:questions.length+1},(_,i)=>`<span class="dot ${i<=step?'active':''}"></span>`).join('');card.style.animation='none';void card.offsetWidth;card.style.animation='rise .4s ease';if(step===questions.length){card.innerHTML=`<div class="celebrate">💌🎉</div><div class="eyebrow">RESULTADO OFICIAL</div><h1>¡APROBASTE! ❤️</h1><p>¡Felicidades! Jacqueline y José Luis te damos oficialmente la bienvenida a <strong>nuestra boda</strong>.</p><p>¡No podemos esperar para celebrar contigo!</p><div class="buttons"><button id="open">💌 Desbloquear nuestra invitación</button><button class="secondary" id="restart">Volver a jugar ↺</button></div><p id="notice" class="feedback hidden">¡Muy pronto podrás ver todos los detalles de nuestra boda! 💕</p>`;document.getElementById('open').onclick=()=>{if(WEDDINGS_URL.trim()){window.location.href=WEDDINGS_URL}else{document.getElementById('notice').classList.remove('hidden')}};document.getElementById('restart').onclick=()=>{step=0;render()};return}
const q=questions[step];card.innerHTML=`<div class="heart">♡</div><h1>${q.title}</h1><p>${q.sub}</p><div class="buttons" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p>`;const choices=document.getElementById('choices');q.options.forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.className=i?'secondary':'';b.addEventListener('click',next);choices.appendChild(b)});
if(step===0){const arena=document.createElement('div');arena.className='no-arena';arena.innerHTML='<button class="secondary no-btn" type="button" aria-label="No quiero ir">No 😒</button>';choices.after(arena);const no=arena.querySelector('button');let jumps=0;function dodge(e){if(e)e.preventDefault();jumps++;const maxX=Math.max(0,arena.clientWidth-no.offsetWidth-12);const maxY=Math.max(0,arena.clientHeight-no.offsetHeight-10);const x=6+Math.random()*maxX,y=5+Math.random()*maxY;no.style.left=`${x}px`;no.style.top=`${y}px`;no.style.transform='none';document.getElementById('feedback').textContent=['¡Uy! Ese botón no se deja atrapar 😂','¡Inténtalo otra vez! 🤭','¡El NO no es una opción! ❤️'][Math.min(jumps-1,2)]}no.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')dodge(e)});no.addEventListener('pointerdown',dodge);no.addEventListener('click',dodge);no.addEventListener('focus',()=>{document.getElementById('feedback').textContent='¡Ese botón es muy tímido! 🤭'})}
}render();
</script></body></html>
